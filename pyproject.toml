[project]
name = "wtree"
version = "1.2.2"
description = "A CLI tool to manage git worktree repositories - fetch, pull, and check status across all worktrees"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kkamji", email = "rlaxowl5460@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = ["argcomplete>=3.0.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

# PyPI shows no way back to the source without these. The project page carried a
# summary and nothing else: no repository, no issue tracker.
[project.urls]
Homepage = "https://github.com/KKamJi98/wtree"
Source = "https://github.com/KKamJi98/wtree"
Issues = "https://github.com/KKamJi98/wtree/issues"
Changelog = "https://github.com/KKamJi98/wtree/releases"

[project.scripts]
wt = "wtree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wtree"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
