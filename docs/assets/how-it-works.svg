<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">One bare repository. Several independent worktrees.</title>
  <desc id="desc">Fetch and pull bring remote objects and refs into .bare. Four worktrees share that Git database but each checks out its own branch and files. Status reads all worktrees. Pull updates clean worktrees. Add and remove manage checkout directories.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
      .heading { font-size: 27px; font-weight: 700; }
      .name { font-size: 21px; font-weight: 650; }
      .label { font-size: 16px; }
      .muted { font-size: 15px; fill: #526079; }
      .link { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="800" rx="16" fill="#ffffff"/>
  <text x="32" y="48" class="heading">One Git database. Room for every branch.</text>
  <text x="32" y="78" class="muted">project/ is a container, not a checkout. Run wt from it or any worktree inside it.</text>
  <rect x="420" y="112" width="280" height="90" rx="10" fill="#ffffff" stroke="#c6cfdb"/>
  <text x="440" y="147" class="name">origin / remote</text>
  <text x="440" y="176" class="muted">shared branch history</text>
  <line x1="560" y1="202" x2="560" y2="280" class="link"/>
  <text x="584" y="233" class="label">wt fetch / wt pull</text>
  <text x="584" y="255" class="muted">objects + refs</text>
  <rect x="32" y="280" width="1056" height="110" rx="12" fill="#f6f8fb" stroke="#ccd5e1"/>
  <text x="52" y="314" class="name">.bare/</text>
  <text x="52" y="344" class="label">Shared objects, refs, and worktree registrations</text>
  <text x="52" y="371" class="muted">No duplicate clone for each branch</text>
  <g id="worktree-fan-out">
    <path d="M560 390 V454 M152 454 H968" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="152" y1="454" x2="152" y2="518" class="link"/>
    <line x1="424" y1="454" x2="424" y2="518" class="link"/>
    <line x1="696" y1="454" x2="696" y2="518" class="link"/>
    <line x1="968" y1="454" x2="968" y2="518" class="link"/>
  </g>
  <text x="584" y="428" class="muted">checkout + branch ref</text>
  <rect x="32" y="518" width="240" height="102" rx="10" fill="#eef9f3" stroke="#91cbb0"/>
  <text x="52" y="553" class="name">main/</text>
  <text x="52" y="584" class="label">branch: main</text>
  <rect x="304" y="518" width="240" height="102" rx="10" fill="#fff6e9" stroke="#e2bd80"/>
  <text x="324" y="553" class="name">feat-login/</text>
  <text x="324" y="584" class="label">branch: feat/login</text>
  <rect x="576" y="518" width="240" height="102" rx="10" fill="#eef5ff" stroke="#a7bfdf"/>
  <text x="596" y="553" class="name">fix-typo/</text>
  <text x="596" y="584" class="label">branch: fix/typo</text>
  <rect x="848" y="518" width="240" height="102" rx="10" fill="#f5f1fd" stroke="#c5b4e4"/>
  <text x="868" y="553" class="name">release-1.2/</text>
  <text x="868" y="584" class="label">branch: release/1.2</text>
  <text x="32" y="653" class="muted">Each worktree has its own files, index, and HEAD. Commit objects are shared.</text>
  <text x="32" y="710" class="name">Read</text>
  <text x="32" y="739" class="label">wt status / wt list</text>
  <text x="32" y="766" class="muted">inspect every checkout</text>
  <text x="385" y="710" class="name">Sync</text>
  <text x="385" y="739" class="label">wt pull</text>
  <text x="385" y="766" class="muted">fast-forward clean checkouts</text>
  <text x="748" y="710" class="name">Create / clean up</text>
  <text x="748" y="739" class="label">wt add / wt rm</text>
  <text x="748" y="766" class="muted">change checkout directories</text>
</svg>
