[package]
name = "kkamji-wtree"
version = "2.0.1"
edition = "2021"
rust-version = "1.85"
description = "See every worktree's status, sync clean branches, and create or remove worktrees from one bare clone."
license = "MIT"
authors = ["kkamji <rlaxowl5460@gmail.com>"]
repository = "https://github.com/KKamJi98/wtree"
homepage = "https://github.com/KKamJi98/wtree"
readme = "README.md"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# The dynamic completion engine sits behind an unstable feature, so the version
# is pinned exactly: a minor release may change its API or protocol.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
