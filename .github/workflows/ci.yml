# Lint and tests on every push and pull request. The matrix ends are the two
# that can actually break: 3.9 is the floor requires-python promises, and 3.13
# is what a fresh `uv tool install` picks today.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev pytest -q

      # The tests exercise the module; this catches the packaging metadata that
      # they never touch, which is where a rename goes wrong.
      - name: console script resolves
        run: |
          uv tool install .
          wt --help >/dev/null
